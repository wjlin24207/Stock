name: ETF Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"
    - cron: "30 10 * * *"


jobs:
  update:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Browser
        run: |
          playwright install chromium

      - name: Run ETF Update
        run: |
          python run_etf_update.py

      - name: Commit Excel Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add etf_holdings/

          git diff --staged --quiet || git commit -m "Update ETF data"

          git push
